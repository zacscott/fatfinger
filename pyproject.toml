[project]
name = "fatfinger"
version = "0.1.0"
description = "Make a clean AI draft read like it was typed."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
fatfinger = "fatfinger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fatfinger"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
